server:
  port: 8080

spring:
  application:
    name: reg-nrru-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/registration_db
    username: postgres
    password: Admin1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: your-256-bit-secret-key-for-jwt-generation-please-change-me
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html